[package]
name = "nexus-rpc"
version = "0.1.0"
edition = "2021"
description = "JSON-RPC API for NexusChain"

[dependencies]
nexus-primitives = { path = "../nexus-primitives" }
nexus-dag = { path = "../nexus-dag" }
nexus-evm = { path = "../nexus-evm" }
nexus-consensus = { path = "../nexus-consensus" }
nexus-iso = { path = "../nexus-iso" }

# HTTP/RPC
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper = { version = "1", features = ["full"] }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
thiserror = "1"
tracing = "0.1"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.11", features = ["json"] }
