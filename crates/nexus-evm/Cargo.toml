[package]
name = "nexus-evm"
version = "0.1.0"
edition = "2021"
description = "EVM execution environment for NexusChain"

[dependencies]
nexus-primitives = { path = "../nexus-primitives" }
nexus-zkp = { path = "../nexus-zkp" }

# EVM execution
revm = { version = "9", default-features = false, features = ["std", "serde"] }
alloy-primitives = "0.7"
alloy-rlp = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha3 = "0.10"
k256 = { version = "0.13", features = ["ecdsa"] }

# Utilities
thiserror = "1"
tracing = "0.1"
hex = "0.4"
bytes = "1"
dashmap = "5"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
