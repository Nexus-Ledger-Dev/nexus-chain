[package]
name = "nexus-evm"
version = "0.1.0"
edition = "2021"
description = "EVM execution environment for NexusChain"

[features]
default = []
zkp = ["dep:nexus-zkp"]
iso-compliance = ["dep:nexus-iso"]

[dependencies]
nexus-primitives = { path = "../nexus-primitives" }
nexus-zkp = { path = "../nexus-zkp", optional = true }
nexus-iso = { path = "../nexus-iso", optional = true }

# EVM execution
revm = { version = "9", default-features = false, features = ["std", "serde"] }
alloy-primitives = "0.7"
alloy-rlp = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crypto
sha3 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
k256 = { version = "0.13", features = ["ecdsa"] }
blake2 = "0.10"
num-bigint = "0.4"

# BN254 elliptic curve (for EIP-196/197 precompiles)
ark-bn254 = "0.4"
ark-ec = "0.4"
ark-ff = "0.4"
ark-serialize = "0.4"

# Utilities
thiserror = "1"
tracing = "0.1"
hex = "0.4"
bytes = "1"
dashmap = "5"
parking_lot = "0.12"

[dev-dependencies]
tokio-test = "0.4"
